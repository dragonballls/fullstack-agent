name: Build 2 Neural Renderer Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "quality_of_life/neural_mesh.py"
      - "tests/test_neural_mesh_build.py"
      - "scripts/jarvis_desktop.py"
      - "scripts/jarvis_desktop.pyw"
      - "quality_of_life/ui_builds.py"
  workflow_dispatch:

jobs:
  neural-renderer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Build 2 neural renderer
        run: python -m unittest tests.test_neural_mesh_build -v

  neural-renderer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Build 2 neural renderer
        shell: pwsh
        run: python -m unittest tests.test_neural_mesh_build -v
