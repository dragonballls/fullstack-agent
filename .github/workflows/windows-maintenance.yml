name: Windows maintenance tests

on:
  push:
    paths:
      - 'windows_maintenance/**'
      - 'quality_of_life/manifest.py'
      - 'quality_of_life/intents.py'
      - 'tests/test_windows_maintenance_integration.py'
      - 'tests/test_quality_of_life.py'
      - '.github/workflows/windows-maintenance.yml'
  pull_request:
    paths:
      - 'windows_maintenance/**'
      - 'quality_of_life/manifest.py'
      - 'quality_of_life/intents.py'
      - 'tests/test_windows_maintenance_integration.py'
      - 'tests/test_quality_of_life.py'
      - '.github/workflows/windows-maintenance.yml'
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall windows_maintenance quality_of_life self_coding tests
      - name: Run maintenance tests
        run: python -m unittest discover -s windows_maintenance/tests -p 'test_*.py' -v
      - name: Run maintenance integration test
        run: python -m unittest discover -s tests -p 'test_windows_maintenance_integration.py' -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall windows_maintenance quality_of_life self_coding tests
      - name: Run maintenance tests
        shell: pwsh
        run: python -m unittest discover -s windows_maintenance/tests -p 'test_*.py' -v
      - name: Run maintenance integration test
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_windows_maintenance_integration.py' -v
