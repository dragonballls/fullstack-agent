name: Quality-of-life tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install quality-of-life dependencies
        run: python -m pip install -r quality_of_life/requirements.txt
      - name: Compile quality-of-life modules
        run: python -m compileall quality_of_life tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
