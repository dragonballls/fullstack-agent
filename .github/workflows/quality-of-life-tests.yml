name: Quality-of-life tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install quality-of-life dependencies
        run: python -m pip install -r quality_of_life/requirements.txt
      - name: Enforce repository quality floor
        run: python scripts/verify_quality_floor.py --baseline "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Compile quality-of-life modules
        run: python -m compileall quality_of_life tests
      - name: Run neural completeness gate
        run: python -m unittest tests.test_neural_completeness -v
      - name: Run exhaustive Neural master behavior gate
        run: python -m unittest tests.test_neural_advanced.NeuralAdvancedRuntimeTests.test_master_behavior_level_verification_is_exhaustive -v
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
