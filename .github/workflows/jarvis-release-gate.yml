# Authoritative Jarvis Windows release gate
name: Jarvis full release gate

on:
  push:
    branches: [main, migration/jarvis-canonical-2026-09-16, feat/build2-neural-realism]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-floor:
    name: Quality floor / no downgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality-floor dependencies
        run: python -m pip install -r quality_of_life/requirements.txt
      - name: Enforce repository quality floor
        run: python scripts/verify_quality_floor.py --baseline "${{ github.event.pull_request.base.sha || github.event.before }}"

  regression:
    needs: quality-floor
    name: Regression / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: quality_of_life/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r quality_of_life/requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile every Python module
        run: python -m compileall quality_of_life self_coding windows_maintenance scripts tests readiness.py
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Windows-maintenance unit tests
        run: python -m unittest discover -s windows_maintenance/tests -p 'test_*.py' -v

  windows-exe:
    name: Native Windows Jarvis.exe
    timeout-minutes: 45
    needs: regression
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned Fullstack Agent components
        shell: pwsh
        run: python scripts/fetch-fullstack-components.py build_vendor
      - name: Restore cached embedded OmniRoute runtime
        uses: actions/cache@v4
        with:
          path: build_vendor/omniroute_runtime
          key: jarvis-omniroute-windows-${{ runner.arch }}-node-24.21.0-omni-3.8.50-5458026c216f77a3da68ea49152dc33470cfe2cb-schema-6

      - name: Prepare pinned embedded OmniRoute runtime
        shell: pwsh
        run: python scripts/prepare_omniroute_runtime.py build_vendor/omniroute_runtime
      - name: Install runtime and fullstack voice dependencies
        shell: pwsh
        run: |
          python -m pip install -r quality_of_life/requirements.txt
          python -m pip install "setuptools==80.9.0" "pyinstaller==6.22.3" faster-whisper kokoro pynput sounddevice soundfile webrtcvad-wheels webrtcvad numpy httpx
          python -m pip check
      - name: Verify Windows native runtime dependencies
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.prefix)"
          $searchRoots = @($prefix, (Join-Path $env:WINDIR 'System32'))
          $patterns = @('vcruntime140*.dll', 'msvcp140*.dll')
          $foundPaths = New-Object System.Collections.Generic.List[string]
          foreach ($root in $searchRoots) {
            foreach ($pattern in $patterns) {
              Get-ChildItem -LiteralPath $root -Filter $pattern -File -Recurse:$false -ErrorAction SilentlyContinue |
                ForEach-Object { if (-not $foundPaths.Contains($_.FullName)) { $foundPaths.Add($_.FullName) } }
            }
          }
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not ($foundPaths | Where-Object { $_.EndsWith("\$dll", [System.StringComparison]::OrdinalIgnoreCase) })) {
              throw "Required Windows runtime DLL was not found: $dll"
            }
          }
          Set-Content -LiteralPath 'build_runtime_dlls.txt' -Encoding UTF8 -Value $foundPaths
      - name: Write build identity
        shell: pwsh
        run: |
          $commit = '${{ github.sha }}'
          Set-Content -LiteralPath 'quality_of_life/build_info.py' -Encoding UTF8 -Value @(
            '"""Build identity embedded into the frozen Jarvis executable."""'
            ('BUILD_COMMIT = "{0}"' -f $commit)
          )
      - name: Verify embedded upstream imports before packaging
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\build_vendor\backtalk\source;$env:PYTHONPATH"
          python -c "from backtalk.ears import Ears; from backtalk.mouth import Mouth; from backtalk.ptt import PTTListener; from quality_of_life.elevenlabs_voice import ElevenLabsClient, ElevenLabsMouth; print('Fullstack Backtalk + ElevenLabs voice imports OK')"
          if (-not (Test-Path -LiteralPath 'build_vendor\backtalk\source')) { throw 'Backtalk source directory is missing' }
      - name: Build single-file Jarvis.exe
        shell: pwsh
        run: |
          $args = @(
            '-m', 'PyInstaller', '--noconfirm', '--clean', '--onefile', '--windowed', '--name', 'Jarvis',
            '--paths', '.', '--paths', 'build_vendor\backtalk\source',
            '--add-data', 'build_vendor\backtalk\source;backtalk/source',
            '--add-data', 'build_vendor\ai-visualizer\source;ai-visualizer/source',
            '--add-data', 'build_vendor\barehands\source;barehands/source',
            '--add-data', 'build_vendor\ai-memory-vault\source;ai-memory-vault/source',
            '--add-binary', 'build_vendor\omniroute_runtime\node.exe;omniroute_runtime',
            '--add-data', 'build_vendor\omniroute_runtime\node_modules;omniroute_runtime/node_modules',
            '--add-data', 'build_vendor\omniroute_runtime\runtime-manifest.txt;omniroute_runtime',
            '--collect-submodules', 'quality_of_life', '--collect-submodules', 'self_coding',
            '--collect-submodules', 'windows_maintenance', '--collect-submodules', 'backtalk',
            '--collect-all', 'faster_whisper', '--collect-all', 'kokoro', '--collect-submodules', 'webrtcvad',
            '--hidden-import', 'sounddevice', '--hidden-import', 'soundfile', '--hidden-import', 'pynput'
          )
          foreach ($dll in Get-Content -LiteralPath 'build_runtime_dlls.txt') { $args += @('--add-binary', ("{0};." -f $dll)) }
          $args += 'scripts/jarvis_desktop.pyw'
          & python @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'dist/Jarvis.exe')) { throw 'Jarvis.exe was not produced' }
          if ((Get-Item -LiteralPath 'dist/Jarvis.exe').Length -lt 5000000) { throw 'Jarvis.exe is unexpectedly small' }
      - name: Verify embedded OmniRoute package
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'build_vendor/omniroute_runtime/runtime-manifest.txt' -Raw
          if ($manifest -notmatch 'node=24\.21\.0') { throw 'Embedded Node runtime version mismatch' }
          if ($manifest -notmatch 'omniroute=3\.8\.50') { throw 'Embedded OmniRoute version mismatch: expected 3.8.50' }
          if ($manifest -notmatch 'commit=5458026c216f77a3da68ea49152dc33470cfe2cb') { throw 'Embedded OmniRoute source revision mismatch' }
          if (-not (Test-Path -LiteralPath 'build_vendor/omniroute_runtime/node.exe')) { throw 'Embedded node.exe is missing' }
          if (-not (Test-Path -LiteralPath 'build_vendor/omniroute_runtime/node_modules/omniroute/bin/omniroute.mjs')) { throw 'Embedded OmniRoute CLI is missing' }

          $cli = 'build_vendor/omniroute_runtime/node_modules/omniroute/bin/omniroute.mjs'
          $version = & 'build_vendor/omniroute_runtime/node.exe' $cli --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '3.8.50') { throw 'Embedded OmniRoute CLI did not report 3.8.50' }

          # Keep this package-level check independent of a live server. Actual provider
          # storage, stdin-only credential handling, and response redaction are covered
          # by the full regression suite; this step validates the packaged CLI contract.
          $dummy = 'ci-redacted-credential-12345678'
          $previewPath = Join-Path $env:RUNNER_TEMP 'omniroute-preview.json'
          $dummy | & 'build_vendor/omniroute_runtime/node.exe' $cli providers add openai --credential-stdin --yes --dry-run --json *> $previewPath
          $exitCode = $LASTEXITCODE
          $previewText = (Get-Content -LiteralPath $previewPath -Raw -ErrorAction Stop).Trim()
          if ($exitCode -ne 0) {
            Remove-Item -LiteralPath $previewPath -Force -ErrorAction SilentlyContinue
            throw "Embedded OmniRoute credential-stdin dry-run failed (exit code $exitCode): $previewText"
          }
          if ($previewText -match [regex]::Escape($dummy)) {
            Remove-Item -LiteralPath $previewPath -Force -ErrorAction SilentlyContinue
            throw 'Embedded OmniRoute dry-run exposed the credential'
          }
          $previewText = $previewText.TrimStart([char]0xFEFF).Trim()
          $jsonCheck = & 'build_vendor/omniroute_runtime/node.exe' -e "const fs=require('fs'); const raw=fs.readFileSync(process.argv[1],'utf8').replace(/^\\uFEFF/,'').trim(); const start=raw.indexOf('{'); const end=raw.lastIndexOf('}'); if(start<0 || end<start) process.exit(2); const value=JSON.parse(raw.slice(start,end+1)); if(!value || typeof value !== 'object' || Array.isArray(value)) process.exit(3);" $previewPath 2>&1
          $jsonExit = $LASTEXITCODE
          Remove-Item -LiteralPath $previewPath -Force -ErrorAction SilentlyContinue
          if ($jsonExit -ne 0) { throw "Embedded OmniRoute dry-run did not return valid JSON: $jsonCheck" }

      - name: Smoke-test ElevenLabs voice plumbing without a live key
        shell: pwsh
        run: |
          python -c "from quality_of_life.elevenlabs_voice import ElevenLabsMouth; from unittest.mock import Mock, patch; import base64; m=ElevenLabsMouth(client=Mock()); m.client.synthesize.return_value=b'fake-mp3'; p=patch('quality_of_life.elevenlabs_voice.has_api_key', return_value=True); p.start(); r=m.test_speech(); p.stop(); assert r['ok'] and r['spoken']; packets=m.take_audio(); assert base64.b64decode(packets[0]['data'])==b'fake-mp3'; print('ElevenLabs offline voice plumbing OK')"

      - name: Verify PyInstaller toolchain version
        shell: pwsh
        run: |
          $info = python -m PyInstaller --version
          if ($info -ne '6.22.3') { throw "Unexpected PyInstaller version: $info" }
      - name: Smoke-test embedded visualizer and OmniRoute
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JARVIS_SMOKE = '1'
          $env:JARVIS_SMOKE_VOICE = '1'
          $env:JARVIS_SMOKE_WEBVIEW = '1'
          $env:JARVIS_OMNIROUTE_WARMUP = '1'
          $process = $null
          $ready = $false
          try {
            $process = Start-Process -FilePath 'dist/Jarvis.exe' -PassThru -WorkingDirectory (Resolve-Path '.')
            $startupTimeoutSeconds = 120
            $deadline = (Get-Date).AddSeconds($startupTimeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Jarvis.exe exited during startup with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8790/faces/board/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Embedded Fullstack visualizer did not become ready within $startupTimeoutSeconds seconds" }

            $omniStartupTimeoutSeconds = 120
            $omniDeadline = (Get-Date).AddSeconds($omniStartupTimeoutSeconds)
            $omniReady = $false
            $log = Join-Path $env:LOCALAPPDATA 'Jarvis\logs\desktop.log'
            while ((Get-Date) -lt $omniDeadline) {
              if (Test-Path -LiteralPath $log) {
                $contents = Get-Content -LiteralPath $log -Raw
                if ($contents -match 'embedded OmniRoute warm-up (?:failed|did not complete)') {
                  throw 'Jarvis reported that embedded OmniRoute warm-up failed or timed out'
                }
              }
              $tcp = Test-NetConnection -ComputerName '127.0.0.1' -Port 20128 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tcp) { $omniReady = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $omniReady) { throw "Embedded OmniRoute did not become ready within $omniStartupTimeoutSeconds seconds" }

            $healthOk = $false
            foreach ($url in @(
              'http://127.0.0.1:20128/api/monitoring/health',
              'http://127.0.0.1:20128/v1/models',
              'http://127.0.0.1:20128/healthz'
            )) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $url -Headers @{ Accept = 'application/json' } -TimeoutSec 3
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) { $healthOk = $true; break }
              } catch {
                $status = $_.Exception.Response.StatusCode.value__
                if ($status -in @(401, 403, 405)) { $healthOk = $true; break }
              }
            }
            if (-not $healthOk) { throw 'Embedded OmniRoute opened its TCP port but did not answer a health/API probe' }

            & 'build_vendor/omniroute_runtime/node.exe' 'build_vendor/omniroute_runtime/node_modules/omniroute/bin/omniroute.mjs' --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged embedded OmniRoute CLI failed after Jarvis startup' }
          }
          catch {
            Write-Host '=== Jarvis process diagnostics ==='
            if ($null -ne $process) { Write-Host ("PID={0} HasExited={1} ExitCode={2}" -f $process.Id, $process.HasExited, $process.ExitCode) }
            Get-NetTCPConnection -LocalPort 8790 -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            Get-NetTCPConnection -LocalPort 20128 -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            $log = Join-Path $env:LOCALAPPDATA 'Jarvis\logs\desktop.log'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw | Write-Host }
            throw
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            $owners = @(Get-NetTCPConnection -LocalPort 20128 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique)
            foreach ($owner in $owners) {
              if ($owner -and $owner -ne $PID) { Stop-Process -Id $owner -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: Smoke-test the packaged native Jarvis host
        shell: pwsh
        env:
          JARVIS_ALLOW_HEADLESS_GUI: '1'
          JARVIS_UI_SMOKE: '1'
        run: ./scripts/verify_windows_gui_smoke.ps1
      - name: Generate signed Jarvis.exe build attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/Jarvis.exe
      - name: Upload raw Jarvis.exe build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Exe
          path: dist/Jarvis.exe
          if-no-files-found: error
          retention-days: 14

  latest-release:
    name: Publish rolling Jarvis latest release
    if: github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Windows-Exe
          path: dist
      - name: Verify Jarvis.exe build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/Jarvis.exe -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/jarvis-release-gate.yml"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis Latest
          body: |
            commit: ${{ github.sha }}
            Generated only after the full Jarvis release gate passes.
            The packaged binary is provenance-attested and verified before publication.
          files: dist/Jarvis.exe
          overwrite_files: true
          make_latest: false

  tagged-release:
    name: Publish direct Jarvis.exe release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Windows-Exe
          path: dist
      - name: Verify Jarvis.exe build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/Jarvis.exe -R "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/jarvis-release-gate.yml"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis.exe
          generate_release_notes: true